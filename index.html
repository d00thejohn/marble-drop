<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f9f6ee">
<meta name="description" content="3~20명의 순서를 정하는 구슬 추첨 게임">
<title>구슬 드롭 — 순서 추첨 게임</title>
<style>
:root{color-scheme:light;--bg:#f9f6ee;--card:#fffdf7;--line:#ded5c1;--ink:#282d3c;--muted:#595f70;--gold:#855c21;--accent:#e9cd8b;--blue:#435779;--mono:"IBM Plex Mono",ui-monospace,monospace;--sans:"Instrument Sans","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(ellipse at 50% 0,#fffdf5 15%,transparent 60%),var(--bg);color:var(--ink);font:15px/1.55 var(--sans)}
button,input,select,textarea,summary{font:inherit}
button,select,summary{cursor:pointer}
button:disabled,select:disabled,input:disabled{cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,section:focus-visible,h2:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.shell{width:min(1150px,calc(100% - 48px));margin:auto}
.top{height:61px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:850;letter-spacing:.12em;color:#3b4357}
.brand-mark{width:33px;height:33px;display:grid;place-items:center;color:#695024;background:#f3e6c6;border:1px solid #dbbf82;border-radius:50%}
.brand-mark svg{width:19px}
.tool,.quiet{background:#fffdf8;border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:7px 10px;font-size:13px}
.tool:hover,.quiet:hover{background:#f2ead8}
.quiet:disabled{opacity:.55}
.hero{padding:33px 0 22px;text-align:center}
h1,h2,p{margin:0}
h1{font-size:clamp(40px,6vw,66px);font-weight:900;line-height:1.1;letter-spacing:-.078em}
h1 span{color:var(--gold)}
.hero p{color:var(--muted);font-size:14px;margin-top:8px}
main[data-phase=running] .hero,main[data-phase=complete] .hero{display:none}
.rules{font-size:13px;color:var(--muted)}
.rules strong{color:var(--ink);font-weight:700}
.layout{display:grid;align-items:start;gap:13px;padding-bottom:28px}
.layout[data-phase=setup]{max-width:620px;margin:0 auto}
.layout[data-phase=setup] .board{display:none}
.layout[data-phase=running]{width:min(1000px,100%);margin:16px auto 0}
.layout[data-phase=complete]{grid-template-columns:minmax(0,1.9fr) minmax(272px,1fr);margin-top:16px}
.board,.panel{min-width:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}
.board{box-shadow:0 12px 42px #78603512}
.board-head,.board-foot{display:flex;justify-content:space-between;align-items:center;gap:9px;padding:10px 14px;background:#fffcf3}
.board-head{border-bottom:1px solid #e3d9c3;flex-wrap:wrap}
.board-foot{border-top:1px solid #e3d9c3;color:var(--muted);font-size:12px;flex-wrap:wrap}
.state{display:flex;align-items:center;min-width:0;gap:8px;font-weight:750;flex:1 1 120px}
.state i{flex:none;width:8px;height:8px;border-radius:50%;background:#a67527;box-shadow:0 0 8px #bd8a4680}
#status{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.counter{font:650 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--gold);white-space:nowrap}
.board-stage{position:relative}
.drop-actions{position:absolute;top:14px;right:14px;display:grid;gap:6px;min-width:min(138px,37%);max-width:37%}
#drop-next{min-height:44px;padding:8px 13px;overflow-wrap:anywhere;box-shadow:0 3px 9px #78603524}
#pause{min-height:44px;padding:6px 9px}
#drop-next:disabled{opacity:.72}
#next-name{min-width:0}
.track{height:2px;background:#efe6d0}
#progress{display:block;width:100%;height:100%;transform:scaleX(0);transform-origin:left;background:#b28748;transition:transform .25s}
canvas{display:block;width:100%;height:auto}
.speed,.board-actions{display:flex;gap:7px;align-items:center;white-space:nowrap}
.speed select{border:1px solid #d1c3a7;color:var(--ink);background:#fffdf8;border-radius:6px;padding:4px;font:12px var(--mono)}
.panel{padding:22px}
.layout[data-phase=running] .panel{padding:8px 14px;background:transparent}
#running summary{font-weight:700;color:var(--blue);padding:5px 0}
.panel h2{font-size:24px;letter-spacing:-.045em;line-height:1.2}
.panel p.sub{color:var(--muted);font-size:13px;margin-top:7px}
.form-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:19px 0 10px}
.form-row label{font-weight:700}
#count{width:83px;background:#fffdf8;border:1px solid #d6c8ab;border-radius:8px;padding:7px 9px;color:var(--ink);font-family:var(--mono)}
.names-title{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;color:var(--muted);font-size:13px}
.link{border:0;background:none;color:var(--blue);font-size:13px;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.name-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:305px;overflow:auto;overscroll-behavior:contain;padding:3px}
.name-field{min-width:0;display:flex;align-items:center;gap:8px;border:1px solid #ded5c1;background:#fffcf4;border-radius:8px;padding:0 10px}
.name-field:focus-within{border-color:var(--blue)}
.name-field input{background:none;color:var(--ink);padding:10px 0;width:100%;min-width:0;border:none;outline:none;font-size:15px}
.name-field input::placeholder{color:#676d7a}
.name-field input[aria-invalid=true]::placeholder{color:#943f35}
.dot{display:inline-block;width:9px;height:9px;border:1px solid #594b3445;border-radius:50%;background:var(--marble);flex:none}
.primary{display:flex;justify-content:center;align-items:center;gap:9px;width:100%;border:1px solid #d3b373;background:var(--accent);color:#2d2515;border-radius:9px;padding:11px 12px;font-weight:850}
.primary:hover{background:#f1dba6}
.primary:active{transform:translateY(1px)}
#start{margin-top:16px}
.setup-rule{margin-top:13px;text-align:center}
#form-error{color:#943f35;font-size:13px;margin-top:8px}
.round-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.drop-list,.result-list{padding:0;margin:11px 0 0;list-style:none}
.drop-list{max-height:250px;overflow:auto}
.drop-list li,.result-list li{display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line);padding:8px 0;min-width:0}
.drop-list li:last-child,.result-list li:last-child{border:0}
.drop-list li{color:var(--muted);font-size:13px}
.drop-list small{margin-left:auto;color:var(--muted);white-space:nowrap}
.rank{display:grid;place-items:center;width:29px;height:27px;flex:none;border-radius:6px;background:#f0eadc;color:var(--muted);font:650 12px var(--mono)}
.result-list li:first-child .rank{color:#392708;background:var(--accent)}
.result-list li:first-child{color:#73501d}
.person{font-weight:700;overflow-wrap:anywhere;min-width:0;flex:1}
.lane{font:11px var(--mono);color:var(--muted);white-space:nowrap}
#copy{margin-top:14px}
#copy-feedback{margin-top:8px;color:#4e6029;font-size:13px}
#manual-copy{width:100%;margin-top:9px;resize:vertical;background:#fffcf4;border:1px solid #d6c8ab;color:var(--ink);border-radius:8px;padding:8px}
@media(max-width:750px){
.shell{width:calc(100% - 16px)}
.top{height:49px;padding:0 5px}
.hero{padding:24px 6px 17px}
.hero p{margin-top:6px;font-size:13px}
.layout[data-phase=complete]{grid-template-columns:1fr}
.layout[data-phase=complete] .panel{order:-1}
.layout[data-phase=running],.layout[data-phase=complete]{margin-top:9px}
.board-head,.board-foot{padding:8px}
.drop-actions{top:8px;right:8px;min-width:min(92px,37%)}
#drop-next{padding:6px 9px;font-size:14px}
.board-actions .quiet{padding:5px 6px;font-size:12px}
.panel{padding:16px}
.name-field input,#count{font-size:16px}
.name-field input{padding:8px 0}
.name-grid{max-height:285px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="8" cy="11" r="1.7"/><circle cx="16" cy="11" r="1.7"/><circle cx="4" cy="17" r="1.7"/><circle cx="12" cy="17" r="2.7"/><circle cx="20" cy="17" r="1.7"/></svg></span>
      MARBLE DROP
    </div>
    <button id="sound" type="button" class="tool" aria-pressed="false">소리 꺼짐</button>
  </header>
  <main id="main" data-phase="setup">
    <div class="hero">
      <div><h1>구슬 <span>드롭</span></h1><p>구슬이 떨어진 자리로 차례를 정하는 순서 추첨 게임</p></div>
    </div>
    <div id="layout" class="layout" data-phase="setup">
      <section id="board" class="board" aria-label="구슬판" tabindex="-1">
        <div class="board-head"><div class="state"><i aria-hidden="true"></i><span id="status" role="status">추첨 대기 중</span></div><span id="counter" class="counter">00 / 06</span><div id="board-actions" class="board-actions" hidden><button id="edit-running" type="button" class="quiet">명단 수정</button></div></div>
        <div class="track" aria-hidden="true"><span id="progress"></span></div>
        <div class="board-stage">
          <canvas id="canvas" width="1800" height="1200" aria-hidden="true"></canvas>
          <div id="drop-actions" class="drop-actions" hidden>
            <button id="drop-next" class="primary" type="button"><span aria-hidden="true">↓</span><span id="next-name"></span></button>
            <button id="pause" type="button" class="quiet">일시정지</button>
          </div>
        </div>
        <div class="board-foot">
          <span>최종 순서는 왼쪽에서 오른쪽으로</span>
          <label id="speed-control" class="speed" hidden>속도 <select id="speed">
            <option value="0.2">×0.2</option><option value="0.3" selected>×0.3</option><option value="0.4">×0.4</option>
            <option value="0.5">×0.5</option><option value="0.6">×0.6</option><option value="0.75">×0.75</option>
            <option value="0.9">×0.9</option><option value="1">×1</option><option value="1.5">×1.5</option>
            <option value="2">×2</option><option value="4">×4</option>
          </select></label>
        </div>
      </section>
      <section class="panel" aria-label="참가자와 추첨 결과">
        <form id="setup" novalidate>
          <h2>참가자 등록</h2>
          <p class="sub">이름을 비워두면 두성을 포함해 ‘성’으로 끝나는 예시 이름이 자동으로 채워져요.</p>
          <div class="form-row"><label for="count">참가 인원</label><input id="count" type="number" min="3" max="20" step="1" value="6" required></div>
          <div class="names-title"><span>참가자 이름</span><button type="button" id="demo" class="link">예시 이름 넣기</button></div>
          <div id="names" class="name-grid"></div>
          <p id="form-error" role="alert" hidden></p>
          <button id="start" class="primary" type="submit"><span aria-hidden="true">▶</span> 추첨 시작</button>
          <p class="rules setup-rule">같은 칸에 떨어진 구슬은 한쪽으로 굴러가 <strong>첫 빈칸</strong>에 멈춰요. 최종 순서는 <strong>왼쪽부터</strong> 읽어요.</p>
        </form>
        <details id="running" hidden>
          <summary>구슬 낙하 순서 보기</summary>
          <ol id="drop-list" class="drop-list" aria-label="구슬을 떨어뜨리는 순서"></ol>
        </details>
        <div id="finished" hidden>
          <h2 id="results-title" tabindex="-1">최종 순서</h2>
          <ol id="result-list" class="result-list" aria-label="최종 순서"></ol>
          <button id="copy" class="primary" type="button">이름만 순서대로 복사</button>
          <p id="copy-feedback" role="status" hidden></p>
          <textarea id="manual-copy" rows="4" readonly aria-label="최종 순서대로 정리한 이름" hidden></textarea>
          <div class="round-tools"><button id="replay" type="button" class="quiet">다시 추첨</button><button id="edit-finished" type="button" class="quiet">명단 수정</button></div>
        </div>
      </section>
    </div>
  </main>
</div>
<script>
'use strict';

const $ = id => document.getElementById(id);
const canvas = $('canvas');
const ctx = canvas.getContext('2d');
const backdrop = document.createElement('canvas');
backdrop.width = canvas.width;
backdrop.height = canvas.height;
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
const colors = ['#dffc85','#78e5ff','#ff9d89','#c9a7ff','#ffcf70','#fba8d9','#75f0b0','#a8baff','#ffac68','#a8e6a6','#f7ef89','#80cffa','#f998b1','#b8a6ee','#ffa0a0','#70ded1','#d2ce8e','#c2d9ff','#e0a5cc','#8bf5ea'];
const exampleNames = [
  '가성','건성','경성','광성','규성','기성','다성','대성','도성','동성',
  '명성','민성','보성','상성','서성','석성','선성','수성','시성','신성',
  '아성','연성','영성','예성','우성','원성','유성','윤성','은성','인성',
  '재성','정성','종성','준성','지성','진성','찬성','태성','하성','한성',
  '해성','현성','형성','호성','효성','희성'
];
const width = 900;
const centerX = width / 2;
const laneWidth = 56;
const radius = 25;
const rows = 14;
const laneCount = rows + 1;
const boardLeft = (width - laneCount * laneWidth) / 2;
const boardRight = width - boardLeft;
const binTop = 388;
const floorY = binTop + 148;
const height = floorY + 33;
const restingY = floorY - radius - 1;
const rollingY = restingY - 2 * radius;
let viewLeft = 0;
let viewWidth = width;
let leftSlot = 0;
let rightSlot = laneCount - 1;
const laneX = lane => boardLeft + (lane + .5) * laneWidth;
const pad = n => String(n).padStart(2,'0');
const cryptoWord = new Uint32Array(1);
const nameValues = Array(20).fill('');
let participants = [];
let drops = [];
const settledSlots = new Map();
let finalOrder = [];
let completed = 0;
let phase = 'setup';
let frame = 0;
let time = 0;
let previousFrame = null;
let lastPeg = 0;
let paused = false;
let dropping = false;
let audio;
let sound = false;
let formCount = 6;

function randomInt(max){
  const limit = 2 ** 32 - (2 ** 32 % max);
  do { crypto.getRandomValues(cryptoWord); } while (cryptoWord[0] >= limit);
  return cryptoWord[0] % max;
}

function shuffled(list){
  const result = [...list];
  for(let index = result.length - 1; index > 0; index--){
    const other = randomInt(index + 1);
    [result[index],result[other]] = [result[other],result[index]];
  }
  return result;
}

function findOpenSlot(lane,taken){
  if(!taken.has(lane)) return lane;
  const direction = randomInt(2) ? 1 : -1;
  let slot = lane + direction;
  while(taken.has(slot)) slot += direction;
  return slot;
}

function planRound(people){
  const taken = new Set();
  return shuffled(people).map(person => {
    const path = [centerX];
    let lane = 0;
    for(let row = 0; row < rows; row++){
      const right = randomInt(2);
      lane += right;
      path.push(path.at(-1) + (right ? 1 : -1) * laneWidth / 2);
    }
    const slot = findOpenSlot(lane,taken);
    taken.add(slot);
    return {person,path,lane,slot};
  });
}

function slotLabel(slot,compact = false){
  if(slot < 0) return compact ? `L${pad(-slot)}` : `왼쪽 추가 ${-slot}번 칸`;
  if(slot >= laneCount){
    const extra = slot - laneCount + 1;
    return compact ? `R${pad(extra)}` : `오른쪽 추가 ${extra}번 칸`;
  }
  return compact ? pad(slot+1) : `${pad(slot+1)}번 칸`;
}

function phaseTo(next){
  phase = next;
  $('main').dataset.phase = next;
  $('board-actions').hidden = next !== 'running';
  $('drop-actions').hidden = next !== 'running';
  $('speed-control').hidden = next !== 'running';
  $('layout').dataset.phase = next;
  $('setup').hidden = next !== 'setup';
  $('running').hidden = next !== 'running';
  $('finished').hidden = next !== 'complete';
}

function addDot(parent,color){
  const dot = document.createElement('span');
  dot.className = 'dot';
  dot.style.setProperty('--marble',color);
  dot.setAttribute('aria-hidden','true');
  parent.append(dot);
}

function validCount(){
  const n = $('count').valueAsNumber;
  return Number.isInteger(n) && n >= 3 && n <= 20;
}

function renderFields(n){
  formCount = n;
  $('names').replaceChildren();
  for(let index = 0; index < n; index++){
    const label = document.createElement('label');
    label.className = 'name-field';
    addDot(label,colors[index]);
    const input = document.createElement('input');
    input.type = 'text';
    input.maxLength = 40;
    input.autocomplete = 'off';
    input.placeholder = `${index+1}번 이름`;
    input.setAttribute('aria-label',input.placeholder);
    input.value = nameValues[index];
    input.addEventListener('input',() => {
      nameValues[index] = input.value;
      input.removeAttribute('aria-invalid');
      showError('');
    });
    label.append(input);
    $('names').append(label);
  }
  updateProgress(0,n);
}

function fillExampleNames(){
  const current = nameValues.slice(0,formCount).map(name => name.trim());
  const emptyCount = current.filter(name => !name).length;
  if(!emptyCount) return;
  const used = new Set(current);
  const required = used.has('두성') ? [] : ['두성'];
  const available = shuffled(exampleNames.filter(name => !used.has(name)));
  const generated = shuffled([...required,...available.slice(0,emptyCount-required.length)]);
  let next = 0;
  current.forEach((name,index) => {
    if(!name) nameValues[index] = generated[next++];
  });
}

function showError(message){
  $('form-error').textContent = message;
  $('form-error').hidden = !message;
}

function updateProgress(count,total){
  $('counter').textContent = `${pad(count)} / ${pad(total)}`;
  $('progress').style.transform = `scaleX(${count / total})`;
}

function buildDropList(){
  $('drop-list').replaceChildren();
  drops.forEach((drop,index) => {
    const li = document.createElement('li');
    const rank = document.createElement('span');
    rank.className = 'rank';
    rank.textContent = pad(index+1);
    addDot(li,drop.person.color);
    const name = document.createElement('span');
    name.className = 'person';
    name.textContent = drop.person.name;
    const state = document.createElement('small');
    state.textContent = '대기';
    li.prepend(rank);
    li.append(name,state);
    $('drop-list').append(li);
  });
  $('drop-list').scrollTop = 0;
}

function setActive(){
  const drop = drops[completed];
  $('status').textContent = `${drop.person.name} 구슬 낙하 중`;
  const item = $('drop-list').children[completed];
  item.lastElementChild.textContent = '낙하 중';
  const queue = $('drop-list');
  const bottom = item.getBoundingClientRect().bottom - queue.getBoundingClientRect().bottom;
  if(bottom > 0) queue.scrollTop += bottom;
}

function offerNext(){
  const drop = drops[completed];
  $('status').textContent = '이름을 눌러 구슬을 떨어뜨려 주세요';
  $('next-name').textContent = drop.person.name;
  $('drop-next').setAttribute('aria-label',`${drop.person.name} 구슬 떨어뜨리기`);
  $('drop-next').disabled = false;
  $('pause').disabled = true;
  $('drop-next').focus({preventScroll:true});
}

function dropNext(){
  if(phase !== 'running' || dropping || completed === drops.length) return;
  dropping = true;
  time = 0;
  lastPeg = 0;
  previousFrame = null;
  $('drop-next').disabled = true;
  $('pause').disabled = false;
  setActive();
  drawBoard(drops[completed],0);
  frame = requestAnimationFrame(animate);
}

function startRound(){
  cancelAnimationFrame(frame);
  drops = planRound(participants);
  resizeBoard(drops);
  $('running').open = false;
  settledSlots.clear();
  finalOrder = [];
  completed = 0;
  time = 0;
  lastPeg = 0;
  previousFrame = null;
  paused = false;
  dropping = false;
  $('pause').textContent = '일시정지';
  phaseTo('running');
  buildDropList();
  updateProgress(0,drops.length);
  window.scrollTo(0,0);
  drawBoard();
  offerNext();
}

function editNames(){
  cancelAnimationFrame(frame);
  phaseTo('setup');
  settledSlots.clear();
  finalOrder = [];
  $('status').textContent = '추첨 대기 중';
  updateProgress(0,formCount);
  $('count').focus();
}

function finishRound(){
  finalOrder = [...settledSlots.values()].sort((a,b) => a.slot - b.slot);
  const list = $('result-list');
  list.replaceChildren();
  finalOrder.forEach((drop,index) => {
    const item = document.createElement('li');
    const rank = document.createElement('span');
    rank.className = 'rank';
    rank.textContent = pad(index+1);
    rank.setAttribute('aria-hidden','true');
    item.append(rank);
    addDot(item,drop.person.color);
    const name = document.createElement('span');
    name.className = 'person';
    name.textContent = drop.person.name;
    const lane = document.createElement('span');
    lane.className = 'lane';
    lane.textContent = slotLabel(drop.slot);
    item.append(name,lane);
    list.append(item);
  });
  $('copy-feedback').hidden = true;
  $('manual-copy').hidden = true;
  phaseTo('complete');
  $('status').textContent = '최종 순서 확정';
  drawBoard();
  $('results-title').focus();
}

function settle(drop){
  settledSlots.set(drop.slot,drop);
  $('drop-list').children[completed].lastElementChild.textContent = slotLabel(drop.slot);
  completed++;
  updateProgress(completed,drops.length);
  playTone(310,.14,'sine');
}

const entranceTime = 210;
const pegTime = 124;
const exitTime = entranceTime + rows * pegTime;
const landingTime = exitTime + 390;
const pegY = row => 78 + 22 * row;
const rollDuration = drop => drop.slot === drop.lane ? 0 : 160 + 100 * Math.abs(drop.slot-drop.lane);
const slideY = (from,to,t) => from + (to-from)*t*t;

function position(drop,elapsed){
  if(elapsed <= entranceTime){
    const t = Math.max(0,elapsed / entranceTime);
    return [centerX,23 + (pegY(0)-radius-27)*t*t];
  }
  if(elapsed < exitTime){
    const row = Math.floor((elapsed - entranceTime) / pegTime);
    const t = (elapsed - entranceTime - row * pegTime) / pegTime;
    const start = pegY(row)-radius-4;
    const end = row === rows - 1 ? binTop - 7 : pegY(row+1)-radius-4;
    const x = drop.path[row] + (drop.path[row+1]-drop.path[row])*t;
    return [x,start + (end-start)*t - 8*Math.sin(Math.PI*t)];
  }
  const duration = rollDuration(drop);
  if(elapsed <= landingTime){
    const t = (elapsed-exitTime)/(landingTime-exitTime);
    return [laneX(drop.lane),slideY(binTop-7,duration ? rollingY : restingY,t)];
  }
  if(!duration) return [laneX(drop.slot),restingY];

  const t = Math.min(1,(elapsed-landingTime)/duration);
  const travel = Math.min(1,t/.78);
  const x = laneX(drop.lane + (drop.slot-drop.lane)*travel);
  if(travel < 1) return [x,rollingY-9*Math.sin(Math.PI*travel)];
  return [x,slideY(rollingY,restingY,(t-.78)/.22)];
}

function animate(now){
  if(phase !== 'running' || paused || !dropping) return;
  const speed = Number($('speed').value);
  time += Math.min(now-(previousFrame ?? now),64)*speed;
  previousFrame = now;
  const drop = drops[completed];
  const duration = rollDuration(drop);
  if(time >= landingTime + duration){
    settle(drop);
    dropping = false;
    if(completed === drops.length) finishRound();
    else {
      drawBoard();
      offerNext();
    }
    return;
  }
  if(time >= landingTime){
    const direction = drop.slot < drop.lane ? '왼쪽' : '오른쪽';
    const status = `${drop.person.name} 구슬이 ${direction} 빈칸으로 이동 중`;
    if($('status').textContent !== status) $('status').textContent = status;
  }
  const hit = Math.max(0,Math.min(rows,1+Math.floor((time-entranceTime)/pegTime)));
  if(hit > lastPeg){
    lastPeg = hit;
    playTone(530 + hit * 42,.055,'triangle');
  }
  drawBoard(drop,time);
  frame = requestAnimationFrame(animate);
}

function line(x1,y1,x2,y2,color,lineWidth=1){
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.lineWidth = lineWidth;
  ctx.strokeStyle = color;
  ctx.stroke();
}

function circle(x,y,r,fill){
  ctx.beginPath();
  ctx.arc(x,y,r,0,2*Math.PI);
  ctx.fillStyle = fill;
  ctx.fill();
}

function drawMarbleName(name,x,y){
  const characters = Array.from(name);
  const maxWidth = 44;
  ctx.fillStyle = '#302837';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for(let size=17;size>=14;size--){
    ctx.font = `800 ${size}px system-ui, sans-serif`;
    if(ctx.measureText(name).width <= maxWidth){
      ctx.fillText(name,x,y+.5);
      return;
    }
  }
  ctx.font = '800 14px system-ui, sans-serif';
  const measure = value => ctx.measureText(value).width;
  for(let split=Math.ceil(characters.length/2);split>0;split--){
    const upper = characters.slice(0,split).join('').trim();
    const lower = characters.slice(split).join('').trim();
    if(measure(upper) <= maxWidth && measure(lower) <= maxWidth){
      ctx.fillText(upper,x,y-7);
      ctx.fillText(lower,x,y+7);
      return;
    }
  }
  let split = 1;
  while(split < characters.length && measure(characters.slice(0,split+1).join('')) <= maxWidth) split++;
  const upper = characters.slice(0,split).join('');
  let lower = '';
  for(const character of characters.slice(split)){
    if(measure(lower+character+'…') > maxWidth) break;
    lower += character;
  }
  ctx.fillText(upper,x,y-7);
  ctx.fillText(lower.trimEnd()+'…',x,y+7);
}

function drawMarble(x,y,person){
  ctx.save();
  ctx.shadowBlur = 9;
  ctx.shadowOffsetY = 2;
  ctx.shadowColor = '#69502b45';
  circle(x,y,radius,person.color);
  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;
  const sheen = ctx.createRadialGradient(x-radius*.4,y-radius*.46,0,x,y,radius);
  sheen.addColorStop(0,'#fffffff4');
  sheen.addColorStop(.63,'#ffffff43');
  sheen.addColorStop(1,'#44325926');
  circle(x,y,radius,sheen);
  ctx.strokeStyle = '#6f573d72';
  ctx.lineWidth = 1;
  ctx.stroke();
  drawMarbleName(person.name,x,y);
  ctx.restore();
}

function resizeBoard(planned){
  const slots = planned.map(drop => drop.slot);
  leftSlot = Math.min(0,...slots);
  rightSlot = Math.max(laneCount-1,...slots);
  viewLeft = leftSlot * laneWidth;
  viewWidth = width + (rightSlot-leftSlot-laneCount+1)*laneWidth;
  canvas.width = backdrop.width = viewWidth * 2;
  canvas.height = backdrop.height = height * 2;
  paintBackdrop();
}

function drawArch(offset,color){
  ctx.beginPath();
  const left = boardLeft + offset;
  const right = boardRight - offset;
  const shoulderY = binTop * .77;
  ctx.moveTo(left,binTop);
  ctx.lineTo(left,shoulderY);
  ctx.bezierCurveTo(left,binTop*.41,centerX-200+offset,binTop*.24,centerX,24+offset);
  ctx.bezierCurveTo(centerX+200-offset,binTop*.24,right,binTop*.41,right,shoulderY);
  ctx.lineTo(right,binTop);
  ctx.lineWidth = 1;
  ctx.strokeStyle = color;
  ctx.stroke();
}

function paintBackdrop(){
  ctx.setTransform(2,0,0,2,-viewLeft*2,0);
  const background = ctx.createLinearGradient(0,0,0,height);
  background.addColorStop(0,'#fff9e9');
  background.addColorStop(.54,'#f0f1f5');
  background.addColorStop(1,'#faf4e5');
  ctx.fillStyle = background;
  ctx.fillRect(viewLeft,0,viewWidth,height);
  const glow = ctx.createRadialGradient(centerX,28,0,centerX,62,330);
  glow.addColorStop(0,'#fff1bf');
  glow.addColorStop(.5,'#fff6d5ac');
  glow.addColorStop(1,'#fff6d500');
  ctx.fillStyle = glow;
  ctx.fillRect(viewLeft,0,viewWidth,binTop);

  // Translucent panels and tracery echo a chapel window behind the pegs.
  const panels = ['#cfdeef72','#f0deb878','#eee4f36b','#f0deb878','#cfdeef72'];
  const endpoints = [0,.19,.38,.62,.81,1].map(fraction => boardLeft + fraction * (boardRight-boardLeft));
  for(let panel=0;panel<panels.length;panel++){
    ctx.beginPath();
    ctx.moveTo(centerX,27);
    ctx.lineTo(endpoints[panel],binTop);
    ctx.lineTo(endpoints[panel+1],binTop);
    ctx.closePath();
    ctx.fillStyle = panels[panel];
    ctx.fill();
  }
  drawArch(0,'#b18b4e86');
  drawArch(11,'#b18b4e44');
  for(const x of endpoints.slice(1,-1)) line(centerX,27,x,binTop,'#b18b4e42');
  line(centerX,7,centerX,31,'#a87832',1.4);
  line(centerX-8,15,centerX+8,15,'#a87832',1.4);
  line(centerX-14,32,centerX+14,32,'#ae813b',2);

  for(let row=0;row<rows;row++){
    for(let col=0;col<=row;col++){
      const x=centerX+(2*col-row)*laneWidth/2;
      const y=pegY(row);
      circle(x,y,4.3,'#fff9e7');
      circle(x,y,2.8,'#8e7346');
      circle(x-.55,y-.6,.9,'#f5d899');
    }
  }
  backdrop.getContext('2d').drawImage(canvas,0,0);
}

function drawBoard(active,elapsed){
  ctx.drawImage(backdrop,viewLeft,0,viewWidth,height);
  for(let slot=leftSlot;slot<=rightSlot;slot++){
    const x = laneX(slot);
    const occupied = settledSlots.has(slot);
    const extra = slot < 0 || slot >= laneCount;
    const top = extra ? rollingY-radius : binTop;
    ctx.fillStyle = occupied ? '#f2e6cbbd' : extra ? '#ebdfc97a' : slot % 2 ? '#f9f5eaac' : '#edf0f7b8';
    const left = x - laneWidth/2;
    ctx.fillRect(left+1,top,laneWidth-2,floorY-top);
    line(left,top,left,floorY,'#bbac8d');
    ctx.fillStyle = occupied ? '#634719' : '#656679';
    ctx.font = '600 15px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(slotLabel(slot,true),x,floorY + 17);
  }
  const trayLeft = laneX(leftSlot) - laneWidth/2;
  const trayRight = laneX(rightSlot) + laneWidth/2;
  line(trayRight,rightSlot >= laneCount ? rollingY-radius : binTop,trayRight,floorY,'#bbac8d');
  line(trayLeft,floorY,trayRight,floorY,'#a2824b',1.4);

  settledSlots.forEach((drop,slot) => drawMarble(laneX(slot),restingY,drop.person));

  if(active){
    const color = active.person.color;
    if(!reducedMotion.matches){
      const trailStart = Math.max(0,elapsed-510);
      let [x,y] = position(active,trailStart);
      ctx.save();
      ctx.shadowColor = color;
      ctx.shadowBlur = 10;
      for(let t=trailStart+16;t<elapsed;t+=16){
        const [nextX,nextY] = position(active,t);
        ctx.globalAlpha = .15 + .7*(1-(elapsed-t)/510);
        line(x,y,nextX,nextY,color,3.6);
        x = nextX;
        y = nextY;
      }
      ctx.restore();
    }
    const [x,y] = position(active,elapsed);
    drawMarble(x,y,active.person);
  }
}

function playTone(frequency,duration,type){
  if(!sound || !audio || audio.state !== 'running') return;
  const start = audio.currentTime;
  const oscillator = audio.createOscillator();
  const gain = audio.createGain();
  oscillator.type = type;
  oscillator.frequency.value = frequency;
  gain.gain.setValueAtTime(.0001,start);
  gain.gain.exponentialRampToValueAtTime(.038,start+.008);
  gain.gain.exponentialRampToValueAtTime(.0001,start+duration);
  oscillator.connect(gain);
  gain.connect(audio.destination);
  oscillator.start(start);
  oscillator.stop(start+duration);
}

async function toggleSound(){
  try{
    if(!sound){
      const Audio = window.AudioContext || window.webkitAudioContext;
      if(!Audio) throw new Error('Web Audio unavailable');
      audio ??= new Audio();
      await audio.resume();
      sound = audio.state === 'running';
    } else {
      sound = false;
    }
    $('sound').textContent = sound ? '소리 켜짐' : '소리 꺼짐';
    $('sound').setAttribute('aria-pressed',String(sound));
    if(sound) playTone(650,.11,'sine');
  } catch{
    $('sound').textContent = '소리 사용 불가';
    $('sound').disabled = true;
  }
}

async function copyNames(){
  const copyButton = $('copy');
  const field = $('manual-copy');
  const feedback = $('copy-feedback');
  const text = finalOrder.map(drop => drop.person.name).join('\n');
  field.value = text;
  let copied = false;
  try{
    await navigator.clipboard.writeText(text);
    copied = true;
  } catch{
    field.hidden = false;
    field.focus();
    field.select();
    try { copied = document.execCommand('copy'); } catch { /* Manual selection remains visible. */ }
  }
  field.hidden = copied;
  if(copied) copyButton.focus({preventScroll:true});
  feedback.textContent = copied ? `${finalOrder.length}명의 이름을 순서대로 복사했어요.` : '선택된 이름을 길게 누르거나 복사 단축키를 사용하세요.';
  feedback.hidden = false;
}

$('count').addEventListener('input',() => {
  if(!validCount()) return;
  $('count').removeAttribute('aria-invalid');
  showError('');
  if($('count').valueAsNumber !== formCount) renderFields($('count').valueAsNumber);
});
$('demo').addEventListener('click',() => {
  if(!validCount()) $('count').value = String(formCount);
  fillExampleNames();
  $('count').removeAttribute('aria-invalid');
  showError('');
  renderFields(formCount);
});
$('setup').addEventListener('submit',event => {
  event.preventDefault();
  if(!validCount()){
    $('count').setAttribute('aria-invalid','true');
    showError('참가 인원은 3명에서 20명 사이의 정수로 입력해 주세요.');
    $('count').focus();
    return;
  }
  fillExampleNames();
  renderFields(formCount);
  participants = nameValues.slice(0,formCount).map((name,index) => ({name:name.trim(),color:colors[index]}));
  showError('');
  startRound();
});
$('drop-next').addEventListener('click',dropNext);
$('pause').addEventListener('click',() => {
  if(!dropping) return;
  paused = !paused;
  $('pause').textContent = paused ? '계속하기' : '일시정지';
  if(paused){
    cancelAnimationFrame(frame);
    $('status').textContent = '일시정지';
  } else {
    previousFrame = null;
    setActive();
    frame = requestAnimationFrame(animate);
  }
});
$('edit-running').addEventListener('click',editNames);
$('edit-finished').addEventListener('click',editNames);
$('replay').addEventListener('click',startRound);
$('sound').addEventListener('click',toggleSound);
$('copy').addEventListener('click',copyNames);
renderFields(formCount);
</script>
</body>
