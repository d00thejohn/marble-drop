<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#11110f">
<meta name="description" content="3~20명의 순서를 정하는 구슬 추첨 게임">
<title>구슬 드롭 — 순서 추첨 게임</title>
<style>
:root{color-scheme:dark;--bg:#11110f;--card:#1b1b18;--line:#35352d;--ink:#f8f4e8;--muted:#b9b6a8;--lime:#defb86;--mono:"IBM Plex Mono",ui-monospace,monospace;--sans:"Instrument Sans","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans)}
button,input,select,textarea{font:inherit}
button,select{cursor:pointer}
button:disabled,select:disabled,input:disabled{cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,section:focus-visible,h2:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.shell{width:min(1160px,calc(100% - 56px));margin:auto}
.top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:850;letter-spacing:.08em}
.brand-mark{width:34px;height:34px;display:grid;place-items:center;color:#151713;background:var(--lime);border-radius:50%}
.brand-mark svg{width:20px}
.tool,.quiet{background:transparent;border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:7px 11px;font-size:13px}
.tool:hover,.quiet:hover{background:#2a2b23}
.hero{display:flex;align-items:end;justify-content:space-between;gap:24px;padding:42px 0 28px}
h1,h2,p{margin:0}
h1{font-size:clamp(45px,7vw,83px);font-weight:900;line-height:1.04;letter-spacing:-.085em}
h1 span{color:var(--lime)}
.hero p{color:var(--muted);font-size:15px;margin-top:12px}
.rules{font-size:13px;color:var(--muted);border-left:1px solid #4c4c3a;padding:1px 0 1px 14px;min-width:max-content}
.rules strong{color:var(--ink);font-weight:650}
.layout{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(285px,1fr);gap:18px;align-items:start;padding-bottom:36px}
.board,.panel{min-width:0;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.board{background:#141614}
.board-head,.board-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;background:#1a1c17}
.board-head{border-bottom:1px solid #303329}
.board-foot{border-top:1px solid #303329;color:var(--muted);font-size:12px}
.state{display:flex;align-items:center;min-width:0;gap:9px;font-weight:700}
.state i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 12px #defb8680}
#status{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.counter{font:600 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--lime);white-space:nowrap}
.track{height:2px;background:#303329}
#progress{display:block;width:100%;height:100%;transform:scaleX(0);transform-origin:left;background:var(--lime);transition:transform .25s}
canvas{display:block;width:100%;height:auto;aspect-ratio:720/550}
.speed{display:flex;gap:7px;align-items:center;white-space:nowrap}
.speed select{border:1px solid #414537;color:var(--ink);background:#23261e;border-radius:6px;padding:3px 4px;font:12px var(--mono)}
.panel{background:var(--card);padding:21px}
.panel h2{font-size:23px;letter-spacing:-.045em;line-height:1.2}
.panel p.sub{color:var(--muted);font-size:13px;margin-top:7px}
.form-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:19px 0 10px}
.form-row label{font-weight:700}
#count{width:83px;background:#12130f;border:1px solid #454539;border-radius:8px;padding:7px 9px;color:var(--ink);font-family:var(--mono)}
.names-title{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;color:var(--muted);font-size:12px}
.link{border:0;background:none;color:var(--lime);font-size:12px;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.name-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;max-height:265px;overflow:auto;overscroll-behavior:contain;padding:3px}
.name-field{min-width:0;display:flex;align-items:center;gap:7px;border:1px solid #38392f;background:#151611;border-radius:8px;padding:0 8px}
.name-field:focus-within{border-color:var(--lime)}
.name-field input{background:none;color:var(--ink);padding:9px 0;width:100%;min-width:0;border:none;outline:none;font-size:14px}
.name-field input::placeholder{color:#979685}
.name-field input[aria-invalid=true]::placeholder{color:#ffb4a1}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--marble);flex:none}
.primary{display:flex;justify-content:center;align-items:center;gap:9px;width:100%;border:0;background:var(--lime);color:#1b2110;border-radius:9px;padding:11px 12px;font-weight:850}
.primary:hover{background:#ecffa9}
.primary:active{transform:translateY(1px)}
#start{margin-top:16px}
#form-error{color:#ffb4a1;font-size:13px;margin-top:8px}
.round-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.active-name{min-width:0;display:flex;align-items:center;gap:9px;margin-top:16px;background:#272b1f;border:1px solid #454e33;padding:11px;border-radius:8px;color:var(--lime);font-weight:750;overflow-wrap:anywhere}
.drop-list,.result-list{padding:0;margin:14px 0 0;list-style:none}
.drop-list{max-height:335px;overflow:auto}
.drop-list li,.result-list li{display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line);padding:8px 0;min-width:0}
.drop-list li:last-child,.result-list li:last-child{border:0}
.drop-list li{color:var(--muted);font-size:13px}
.drop-list small{margin-left:auto;color:var(--muted);white-space:nowrap}
.rank{display:grid;place-items:center;width:29px;height:27px;flex:none;border-radius:6px;background:#2a2b21;color:var(--muted);font:650 12px var(--mono)}
.result-list li:first-child .rank{color:#1b2110;background:var(--lime)}
.result-list li:first-child{color:var(--lime)}
.person{font-weight:700;overflow-wrap:anywhere;min-width:0;flex:1}
.lane{font:11px var(--mono);color:var(--muted);white-space:nowrap}
#copy{margin-top:14px}
#copy-feedback{margin-top:8px;color:var(--lime);font-size:13px}
#manual-copy{width:100%;margin-top:9px;resize:vertical;background:#151611;border:1px solid #454539;color:var(--ink);border-radius:8px;padding:8px}
@media(max-width:750px){
.shell{width:calc(100% - 28px)}
.top{height:57px}
.hero{padding:23px 0 19px;align-items:start;flex-direction:column;gap:11px}
.hero p{margin-top:7px;font-size:13px}
.rules{border:0;padding:0;font-size:12px}
.layout{display:flex;flex-direction:column;gap:12px}
.layout>*{width:100%}
.layout[data-phase=setup] .panel{order:-1}
.layout[data-phase=complete] .panel{order:-1}
.board-head,.board-foot{padding:10px 11px}
.panel{padding:16px}
.name-field input,#count{font-size:16px}
.name-field input{padding:8px 0}
.name-grid{max-height:220px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="8" cy="11" r="1.7"/><circle cx="16" cy="11" r="1.7"/><circle cx="4" cy="17" r="1.7"/><circle cx="12" cy="17" r="2.7"/><circle cx="20" cy="17" r="1.7"/></svg></span>
      MARBLE DROP
    </div>
    <button id="sound" type="button" class="tool" aria-pressed="false">소리 꺼짐</button>
  </header>
  <main>
    <div class="hero">
      <div><h1>구슬 <span>드롭</span></h1><p>구슬이 떨어진 자리로 차례를 정하는 순서 추첨 게임</p></div>
      <div class="rules"><strong>왼쪽 칸 → 오른쪽 칸</strong><br>같은 칸은 위쪽 구슬부터</div>
    </div>
    <div id="layout" class="layout" data-phase="setup">
      <section id="board" class="board" aria-label="구슬판" tabindex="-1">
        <div class="board-head"><div class="state"><i aria-hidden="true"></i><span id="status" role="status">추첨 대기 중</span></div><span id="counter" class="counter">00 / 06</span></div>
        <div class="track" aria-hidden="true"><span id="progress"></span></div>
        <canvas id="canvas" width="1440" height="1100" aria-hidden="true"></canvas>
        <div class="board-foot"><span>왼쪽 칸부터 순서 확정 <span aria-hidden="true">→</span></span><label class="speed">속도 <select id="speed"><option value="1">×1</option><option value="2">×2</option><option value="4">×4</option></select></label></div>
      </section>
      <section class="panel" aria-label="참가자와 추첨 결과">
        <form id="setup" novalidate>
          <h2>참가자 등록</h2>
          <p class="sub">이름을 입력하면 구슬을 떨어뜨릴 차례가 무작위로 정해져요.</p>
          <div class="form-row"><label for="count">참가 인원</label><input id="count" type="number" min="3" max="20" step="1" value="6" required></div>
          <div class="names-title"><span>참가자 이름</span><button type="button" id="demo" class="link">예시 이름 넣기</button></div>
          <div id="names" class="name-grid"></div>
          <p id="form-error" role="alert" hidden></p>
          <button id="start" class="primary" type="submit"><span aria-hidden="true">▶</span> 구슬 떨어뜨리기</button>
        </form>
        <div id="running" hidden>
          <h2>구슬 낙하 순서</h2>
          <div class="active-name" id="active-name"></div>
          <ol id="drop-list" class="drop-list" aria-label="구슬을 떨어뜨리는 순서"></ol>
          <div class="round-tools"><button id="pause" type="button" class="quiet">일시정지</button><button id="edit-running" type="button" class="quiet">명단 수정</button></div>
        </div>
        <div id="finished" hidden>
          <h2 id="results-title" tabindex="-1">최종 순서</h2>
          <ol id="result-list" class="result-list" aria-label="최종 순서"></ol>
          <button id="copy" class="primary" type="button">이름만 순서대로 복사</button>
          <p id="copy-feedback" role="status" hidden></p>
          <textarea id="manual-copy" rows="4" readonly aria-label="최종 순서대로 정리한 이름" hidden></textarea>
          <div class="round-tools"><button id="replay" type="button" class="quiet">다시 추첨</button><button id="edit-finished" type="button" class="quiet">명단 수정</button></div>
        </div>
      </section>
    </div>
  </main>
</div>
<script>
'use strict';

const $ = id => document.getElementById(id);
const canvas = $('canvas');
const ctx = canvas.getContext('2d');
const backdrop = document.createElement('canvas');
backdrop.width = canvas.width;
backdrop.height = canvas.height;
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
const colors = ['#dffc85','#78e5ff','#ff9d89','#c9a7ff','#ffcf70','#fba8d9','#75f0b0','#a8baff','#ffac68','#a8e6a6','#f7ef89','#80cffa','#f998b1','#b8a6ee','#ffa0a0','#70ded1','#d2ce8e','#c2d9ff','#e0a5cc','#8bf5ea'];
const demoNames = ['민지','지훈','서연','현우','하은','도윤','수아','윤서','지우','예린','유진','서준','나연','은호','시우','연우','지민','가은','유나','하준'];
const width = 720;
const height = 550;
const rows = 10;
const laneCount = rows + 1;
const floorY = 500;
const binTop = 350;
const laneX = lane => 60 + lane * 60;
const pad = n => String(n).padStart(2,'0');
const cryptoWord = new Uint32Array(1);
const nameValues = Array(20).fill('');
let participants = [];
let drops = [];
let lanes = emptyLanes();
let finalOrder = [];
let completed = 0;
let phase = 'setup';
let frame = 0;
let time = 0;
let previousFrame = null;
let lastPeg = 0;
let radius = 12;
let paused = false;
let audio;
let sound = false;
let formCount = 6;

function emptyLanes(){
  return Array.from({length:laneCount}, () => []);
}

function randomInt(max){
  const limit = 2 ** 32 - (2 ** 32 % max);
  do { crypto.getRandomValues(cryptoWord); } while (cryptoWord[0] >= limit);
  return cryptoWord[0] % max;
}

function shuffled(list){
  const result = [...list];
  for(let index = result.length - 1; index > 0; index--){
    const other = randomInt(index + 1);
    [result[index],result[other]] = [result[other],result[index]];
  }
  return result;
}

function planRound(people){
  const stacks = emptyLanes();
  const order = shuffled(people);
  const planned = order.map(person => {
    const path = [360];
    let lane = 0;
    for(let row = 0; row < rows; row++){
      const right = randomInt(2);
      lane += right;
      path.push(path.at(-1) + (right ? 30 : -30));
    }
    const drop = {person,path,lane,level:stacks[lane].length};
    stacks[lane].push(drop);
    return drop;
  });
  const maxStack = Math.max(...stacks.map(stack => stack.length));
  return {planned,radius:Math.min(12,(floorY - binTop - 8) / (2.13 * maxStack))};
}

function rankLanes(stacks){
  return stacks.flatMap(stack => [...stack].reverse());
}

function phaseTo(next){
  phase = next;
  $('layout').dataset.phase = next;
  $('setup').hidden = next !== 'setup';
  $('running').hidden = next !== 'running';
  $('finished').hidden = next !== 'complete';
}

function addDot(parent,color){
  const dot = document.createElement('span');
  dot.className = 'dot';
  dot.style.setProperty('--marble',color);
  dot.setAttribute('aria-hidden','true');
  parent.append(dot);
}

function validCount(){
  const n = $('count').valueAsNumber;
  return Number.isInteger(n) && n >= 3 && n <= 20;
}

function renderFields(n){
  formCount = n;
  $('names').replaceChildren();
  for(let index = 0; index < n; index++){
    const label = document.createElement('label');
    label.className = 'name-field';
    addDot(label,colors[index]);
    const input = document.createElement('input');
    input.type = 'text';
    input.maxLength = 40;
    input.autocomplete = 'off';
    input.placeholder = `${index+1}번 이름`;
    input.setAttribute('aria-label',input.placeholder);
    input.value = nameValues[index];
    input.addEventListener('input',() => {
      nameValues[index] = input.value;
      input.removeAttribute('aria-invalid');
      showError('');
    });
    label.append(input);
    $('names').append(label);
  }
  updateProgress(0,n);
}

function showError(message){
  $('form-error').textContent = message;
  $('form-error').hidden = !message;
}

function updateProgress(count,total){
  $('counter').textContent = `${pad(count)} / ${pad(total)}`;
  $('progress').style.transform = `scaleX(${count / total})`;
}

function buildDropList(){
  $('drop-list').replaceChildren();
  drops.forEach((drop,index) => {
    const li = document.createElement('li');
    const rank = document.createElement('span');
    rank.className = 'rank';
    rank.textContent = pad(index+1);
    addDot(li,drop.person.color);
    const name = document.createElement('span');
    name.className = 'person';
    name.textContent = drop.person.name;
    const state = document.createElement('small');
    state.textContent = '대기';
    li.prepend(rank);
    li.append(name,state);
    $('drop-list').append(li);
  });
  $('drop-list').scrollTop = 0;
}

function setActive(){
  const drop = drops[completed];
  const active = $('active-name');
  active.replaceChildren();
  addDot(active,drop.person.color);
  active.append(`${drop.person.name} 구슬 낙하 중`);
  $('status').textContent = `${drop.person.name} 구슬 낙하 중`;
  const item = $('drop-list').children[completed];
  item.lastElementChild.textContent = '낙하 중';
  const queue = $('drop-list');
  const bottom = item.getBoundingClientRect().bottom - queue.getBoundingClientRect().bottom;
  if(bottom > 0) queue.scrollTop += bottom;
}

function startRound(){
  cancelAnimationFrame(frame);
  const plan = planRound(participants);
  drops = plan.planned;
  radius = plan.radius;
  lanes = emptyLanes();
  finalOrder = [];
  completed = 0;
  time = 0;
  lastPeg = 0;
  previousFrame = null;
  paused = false;
  $('pause').textContent = '일시정지';
  phaseTo('running');
  buildDropList();
  setActive();
  updateProgress(0,drops.length);
  $('board').focus();
  drawBoard();
  frame = requestAnimationFrame(animate);
}

function editNames(){
  cancelAnimationFrame(frame);
  phaseTo('setup');
  lanes = emptyLanes();
  finalOrder = [];
  radius = 12;
  $('status').textContent = '추첨 대기 중';
  updateProgress(0,formCount);
  drawBoard();
  $('count').focus();
}

function finishRound(){
  finalOrder = rankLanes(lanes);
  const list = $('result-list');
  list.replaceChildren();
  finalOrder.forEach((drop,index) => {
    const item = document.createElement('li');
    const rank = document.createElement('span');
    rank.className = 'rank';
    rank.textContent = pad(index+1);
    rank.setAttribute('aria-hidden','true');
    item.append(rank);
    addDot(item,drop.person.color);
    const name = document.createElement('span');
    name.className = 'person';
    name.textContent = drop.person.name;
    const lane = document.createElement('span');
    lane.className = 'lane';
    lane.textContent = `${pad(drop.lane + 1)}번 칸`;
    item.append(name,lane);
    list.append(item);
  });
  $('copy-feedback').hidden = true;
  $('manual-copy').hidden = true;
  phaseTo('complete');
  $('status').textContent = '최종 순서 확정';
  drawBoard();
  $('results-title').focus();
}

function settle(drop){
  lanes[drop.lane].push(drop);
  $('drop-list').children[completed].lastElementChild.textContent = `${pad(drop.lane+1)}번 칸`;
  completed++;
  updateProgress(completed,drops.length);
  playTone(310,.14,'sine');
}

const entranceTime = 210;
const pegTime = 124;
const exitTime = entranceTime + rows * pegTime;
const landingTime = exitTime + 390;
const nextDropTime = landingTime + 210;
const pegY = row => 92 + 25 * row;

function stackY(level){
  return floorY - radius - level * radius * 2.13 - 1;
}

function position(drop,elapsed){
  if(elapsed <= entranceTime){
    const t = Math.max(0,elapsed / entranceTime);
    return [360,33 + (pegY(0)-radius-37)*t*t];
  }
  if(elapsed < exitTime){
    const row = Math.floor((elapsed - entranceTime) / pegTime);
    const t = (elapsed - entranceTime - row * pegTime) / pegTime;
    const start = pegY(row)-radius-4;
    const end = row === rows - 1 ? binTop - 7 : pegY(row+1)-radius-4;
    const x = drop.path[row] + (drop.path[row+1]-drop.path[row])*t;
    return [x,start + (end-start)*t - 8*Math.sin(Math.PI*t)];
  }
  const t = Math.min(1,(elapsed - exitTime)/(landingTime - exitTime));
  return [laneX(drop.lane),binTop - 7 + (stackY(drop.level) - binTop + 7)*t*t];
}

function animate(now){
  if(phase !== 'running' || paused) return;
  const speed = Number($('speed').value);
  const motionMultiplier = reducedMotion.matches ? 3 : 1;
  time += Math.min(now-(previousFrame ?? now),64)*speed*motionMultiplier;
  previousFrame = now;
  if(time >= landingTime && lastPeg !== -1){
    settle(drops[completed]);
    lastPeg = -1;
  }
  if(time >= nextDropTime){
    if(completed === drops.length){
      finishRound();
      return;
    }
    time = 0;
    lastPeg = 0;
    setActive();
  }
  if(lastPeg === -1){
    drawBoard();
  } else {
    const drop = drops[completed];
    const hit = Math.max(0,Math.min(rows,1+Math.floor((time-entranceTime)/pegTime)));
    if(hit > lastPeg){
      lastPeg = hit;
      playTone(530 + hit * 42,.055,'triangle');
    }
    drawBoard(drop,time);
  }
  frame = requestAnimationFrame(animate);
}

function line(x1,y1,x2,y2,color,lineWidth=1){
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.lineWidth = lineWidth;
  ctx.strokeStyle = color;
  ctx.stroke();
}

function circle(x,y,r,fill){
  ctx.beginPath();
  ctx.arc(x,y,r,0,2*Math.PI);
  ctx.fillStyle = fill;
  ctx.fill();
}

function drawMarble(x,y,color,r,rank){
  ctx.save();
  ctx.shadowBlur = 13;
  ctx.shadowColor = color;
  circle(x,y,r,color);
  ctx.shadowBlur = 0;
  const sheen = ctx.createRadialGradient(x-r*.35,y-r*.45,0,x,y,r);
  sheen.addColorStop(0,'#ffffffb0');
  sheen.addColorStop(.55,'#ffffff16');
  sheen.addColorStop(1,'#090c004d');
  circle(x,y,r,sheen);
  if(rank && r >= 5){
    ctx.fillStyle = '#191b14';
    ctx.font = `800 ${Math.min(12,r*1.12)}px system-ui`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(rank,x,y+.5);
  }
  ctx.restore();
}

function paintBackdrop(){
  ctx.setTransform(2,0,0,2,0,0);
  const background = ctx.createRadialGradient(360,176,5,360,196,390);
  background.addColorStop(0,'#23291d');
  background.addColorStop(1,'#10130f');
  ctx.fillStyle = background;
  ctx.fillRect(0,0,width,height);

  for(let x=30;x<=690;x+=30){
    for(let y=17;y<floorY;y+=25) circle(x,y,.75,'#31362a');
  }
  line(334,18,349,31,'#626b50');
  line(386,18,371,31,'#626b50');
  ctx.fillStyle='#dffc85';
  ctx.fillRect(349,29,22,3);
  line(349,37,30,binTop,'#454e3c');
  line(371,37,690,binTop,'#454e3c');

  for(let row=0;row<rows;row++){
    for(let col=0;col<=row;col++){
      const x=360+(2*col-row)*30;
      const y=pegY(row);
      circle(x,y,4.5,'#10130f');
      circle(x,y,2.7,'#929c7d');
      circle(x-.6,y-.7,1,'#d6ddbb');
    }
  }

  backdrop.getContext('2d').drawImage(canvas,0,0);
}

function drawBoard(active,elapsed){
  ctx.drawImage(backdrop,0,0,width,height);
  for(let lane=0;lane<laneCount;lane++){
    const x = laneX(lane);
    const occupied = lanes[lane].length > 0;
    ctx.fillStyle = occupied ? '#252a20' : lane % 2 ? '#161a14' : '#181c16';
    ctx.fillRect(x-29,binTop,58,floorY-binTop);
    line(x-30,binTop,x-30,floorY,'#4b5540');
    ctx.fillStyle = occupied ? '#e6ecce' : '#a2aa92';
    ctx.font = '600 15px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(pad(lane+1),x,524);
  }
  line(690,binTop,690,floorY,'#4b5540');
  line(30,floorY,690,floorY,'#798468',1.4);

  const ranks = new Map(finalOrder.map((drop,index) => [drop,index+1]));
  lanes.forEach((stack,lane) => {
    stack.forEach((drop,level) => drawMarble(laneX(lane),stackY(level),drop.person.color,radius,ranks.get(drop)));
  });

  if(active){
    const color = active.person.color;
    if(!reducedMotion.matches){
      const trailStart = Math.max(0,elapsed-510);
      let [x,y] = position(active,trailStart);
      ctx.save();
      ctx.shadowColor = color;
      ctx.shadowBlur = 10;
      for(let t=trailStart+16;t<elapsed;t+=16){
        const [nextX,nextY] = position(active,t);
        ctx.globalAlpha = .15 + .7*(1-(elapsed-t)/510);
        line(x,y,nextX,nextY,color,2.4);
        x = nextX;
        y = nextY;
      }
      ctx.restore();
    }
    const [x,y] = position(active,elapsed);
    drawMarble(x,y,color,radius);
  }
}

function playTone(frequency,duration,type){
  if(!sound || !audio || audio.state !== 'running') return;
  const start = audio.currentTime;
  const oscillator = audio.createOscillator();
  const gain = audio.createGain();
  oscillator.type = type;
  oscillator.frequency.value = frequency;
  gain.gain.setValueAtTime(.0001,start);
  gain.gain.exponentialRampToValueAtTime(.038,start+.008);
  gain.gain.exponentialRampToValueAtTime(.0001,start+duration);
  oscillator.connect(gain);
  gain.connect(audio.destination);
  oscillator.start(start);
  oscillator.stop(start+duration);
}

async function toggleSound(){
  try{
    if(!sound){
      const Audio = window.AudioContext || window.webkitAudioContext;
      if(!Audio) throw new Error('Web Audio unavailable');
      audio ??= new Audio();
      await audio.resume();
      sound = audio.state === 'running';
    } else {
      sound = false;
    }
    $('sound').textContent = sound ? '소리 켜짐' : '소리 꺼짐';
    $('sound').setAttribute('aria-pressed',String(sound));
    if(sound) playTone(650,.11,'sine');
  } catch{
    $('sound').textContent = '소리 사용 불가';
    $('sound').disabled = true;
  }
}

async function copyNames(){
  const copyButton = $('copy');
  const field = $('manual-copy');
  const feedback = $('copy-feedback');
  const text = finalOrder.map(drop => drop.person.name).join('\n');
  field.value = text;
  let copied = false;
  try{
    await navigator.clipboard.writeText(text);
    copied = true;
  } catch{
    field.hidden = false;
    field.focus();
    field.select();
    try { copied = document.execCommand('copy'); } catch { /* Manual selection remains visible. */ }
  }
  field.hidden = copied;
  if(copied) copyButton.focus({preventScroll:true});
  feedback.textContent = copied ? `${finalOrder.length}명의 이름을 순서대로 복사했어요.` : '선택된 이름을 길게 누르거나 복사 단축키를 사용하세요.';
  feedback.hidden = false;
}

$('count').addEventListener('input',() => {
  if(!validCount()) return;
  $('count').removeAttribute('aria-invalid');
  showError('');
  if($('count').valueAsNumber !== formCount) renderFields($('count').valueAsNumber);
});
$('demo').addEventListener('click',() => {
  if(!validCount()) $('count').value = String(formCount);
  for(let index=0;index<formCount;index++) nameValues[index] ||= demoNames[index];
  $('count').removeAttribute('aria-invalid');
  showError('');
  renderFields(formCount);
});
$('setup').addEventListener('submit',event => {
  event.preventDefault();
  if(!validCount()){
    $('count').setAttribute('aria-invalid','true');
    showError('참가 인원은 3명에서 20명 사이의 정수로 입력해 주세요.');
    $('count').focus();
    return;
  }
  const inputs = Array.from($('names').querySelectorAll('input'));
  const missing = inputs.findIndex(input => !input.value.trim());
  if(missing !== -1){
    const input = inputs[missing];
    input.setAttribute('aria-invalid','true');
    showError(`${missing+1}번 참가자의 이름을 입력해 주세요.`);
    input.focus();
    return;
  }
  participants = inputs.map((input,index) => ({name:input.value.trim(),color:colors[index]}));
  showError('');
  startRound();
});
$('pause').addEventListener('click',() => {
  paused = !paused;
  $('pause').textContent = paused ? '계속하기' : '일시정지';
  if(paused){
    cancelAnimationFrame(frame);
    $('status').textContent = '일시정지';
  } else {
    previousFrame = null;
    if(lastPeg === -1) $('status').textContent = '다음 구슬 대기 중';
    else setActive();
    frame = requestAnimationFrame(animate);
  }
});
$('edit-running').addEventListener('click',editNames);
$('edit-finished').addEventListener('click',editNames);
$('replay').addEventListener('click',startRound);
$('sound').addEventListener('click',toggleSound);
$('copy').addEventListener('click',copyNames);
renderFields(formCount);
paintBackdrop();
drawBoard();
</script>
</body>
